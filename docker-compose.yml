services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: housing_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - housing

  nginx:
    image: nginx:1.27-alpine
    container_name: housing_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - housing

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: housing_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - housing

  mysql:
    image: mysql:8.4
    container_name: housing_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: housing
      MYSQL_USER: housing
      MYSQL_PASSWORD: housing
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - housing

  redis:
    image: redis:7-alpine
    container_name: housing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - housing

networks:
  housing:
    driver: bridge

volumes:
  mysql_data:
